# Competency questions for the knowledge glossary ontology.
#
# Each question defines what the ontology should be able to answer.
#   question:  Natural language question
#   category:  Domain grouping
#   priority:  1=high, 2=medium, 3=low
#   requires:  List of relation types or concept names needed to answer.
#              A relation (e.g. "broader") is checked against actual edge coverage.
#              A concept (e.g. "Machine Learning") is checked by note existence.
#
# Add your own questions here — run `python scripts/reason.py competency`
# to see which ones your vault can and cannot answer.

questions:

  # ── Hierarchy & taxonomy ──────────────────────────────────────────
  - question: "What is the parent domain of a given concept?"
    category: hierarchy
    priority: 1
    requires: [broader]

  - question: "What are all the subtypes of a given concept?"
    category: hierarchy
    priority: 1
    requires: [narrower]

  - question: "What is the full ancestor chain from a concept up to a root?"
    category: hierarchy
    priority: 1
    requires: [broader]
    note: "Answered via the inferred ancestor predicate (transitive broader)"

  - question: "Which concepts are root concepts (no broader parent)?"
    category: hierarchy
    priority: 2
    requires: [broader]

  # ── Associations ──────────────────────────────────────────────────
  - question: "What concepts are semantically related to a given concept?"
    category: association
    priority: 1
    requires: [related]

  - question: "What is the opposite of a given concept?"
    category: association
    priority: 2
    requires: [opposite_of]

  # ── Dependencies & composition ────────────────────────────────────
  - question: "What tools or techniques does a given concept use?"
    category: dependency
    priority: 1
    requires: [uses]

  - question: "What are the dependencies of a given concept?"
    category: dependency
    priority: 1
    requires: [depends_on]

  - question: "What can a given concept be constructed with?"
    category: dependency
    priority: 2
    requires: [constructed_with]

  # ── Applicability, combination, success (ontology-plan §4) ─────────
  # `requires` names schema.yml properties and classes (phase 1). Most are
  # absent until phases 1-5, so these start unanswerable by design.
  - id: CQ1
    question: "Which concepts are applicable in situation S (inherited by sub-situations)?"
    category: applicability
    priority: 1
    requires: [appliesIn, broaderGeneric, Situation, Pattern]

  - id: CQ2
    question: "Under which conditions should C be used, and when should it be avoided?"
    category: applicability
    priority: 1
    requires: [hasCondition, hasLimitation]

  - id: CQ3
    question: "Which concepts does C combine with, and in which role?"
    category: combination
    priority: 1
    requires: [role, Pattern]

  - id: CQ4
    question: "Which combinations succeeded in S, and by which measure?"
    category: success
    priority: 1
    requires: [applied, inSituation, outcome, measuredBy, Case]

  - id: CQ5
    question: "What is the evidence, and how much trust does it deserve?"
    category: provenance
    priority: 1
    requires: [wasAttributedTo, wasGeneratedBy]
    note: "Answered from prov/prov.jsonl (PROV-O), not from note frontmatter."

  - id: CQ6
    question: "What can replace C in a role (any kindOf the concept filling it)?"
    category: combination
    priority: 2
    requires: [role, broaderGeneric]

  - id: CQ7
    question: "What is missing to reach goal G (required role left unfilled)?"
    category: success
    priority: 2
    requires: [achieves, requiresRole, Goal]

  - id: CQ8
    question: "Which combinations failed, and why?"
    category: success
    priority: 2
    requires: [applied, outcome, hasLimitation, Case]

  # ── Cross-cutting (require multiple relations) ────────────────────
  - question: "Given an ML technique, what tools does it use and what domain is it part of?"
    category: cross-cutting
    priority: 1
    requires: [uses, broader]

  - question: "What concepts share the same parent domain?"
    category: cross-cutting
    priority: 2
    requires: [broader]

  # ── Questions the vault probably CANNOT answer yet ────────────────
  - question: "Who invented a given algorithm?"
    category: provenance
    priority: 3
    requires: [invented_by]

  - question: "When was a given concept first described?"
    category: provenance
    priority: 3
    requires: [first_described]
